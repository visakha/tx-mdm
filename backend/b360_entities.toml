# Business entities shown in the B360 Data notebook (left pane, under "B360 Data").
#
# How to edit:
#   - Add one [[entity]] block per business entity you want listed.
#   - name  = the entity's internal id as the B360 metadata reports it (e.g. zlv_guest,
#             c360.person). Case does not matter.
#   - label = optional. Overrides the label from the metadata in the left pane.
#   - Order here is the order in the left pane.
#   - A name that is not in your org's metadata shows as "not found in org"; nothing crashes.
#
# The backend reads this file ONCE at startup. Edit, save, then restart the backend
# (Ctrl+C, then uvicorn again). A bad file stops the backend at startup with a clear error.
# Another file can be used instead: set B360_ENTITIES_FILE to its path.
# Plain ASCII only.

[[entity]]
name = "zlv_guest"
# label = "ZLV Guest"

# Source systems the "Add records" tab may send new records to (Create Master Record API).
#   - allowed = the source system ids EXACTLY as IDMC knows them. Case matters: zlv_ttf, not ZLV_TTF.
#   - default = the one picked first in the dropdown (must be in allowed).
#   - The backend refuses any other source system (HTTP 400), so nothing is sent by mistake.
#   - There is no documented API that lists source systems; the Add records tab shows any that
#     an undocumented metadata call does find, as "add to b360_entities.toml to allow".
# Restart the backend after editing, same as above.

[sources]
allowed = ["zlv_ttf", "zlv_eci", "c360.default.system"]
default = "zlv_ttf"
