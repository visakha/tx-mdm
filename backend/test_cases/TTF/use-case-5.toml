# TTF use case 5. Human sections are copied to the Excel Home sheet, never interpreted.
# Only [mock] is read by code (mock path behaviour + generated-data shape).

[use_case]
id = "use-case-5"
source = "TTF"
title = "Inactive member"
template_version = "1.0"
author = "Muse (draft)"
last_updated = "2026-11-23"

[scenario]
summary = "A member arrives with ACTIVE=0 and an INACTIVEDATE."
steps = ["Load the 4 TTF landing sheets", "Run tf_Ldg_MDM_CDI_TTF", "Run tf_Stg_MDM_CDI_TTF", "MDM ingress (tester)", "Match and merge", "Egress (tester)", "Read egress tables", "Compare"]

[test_data]
description = "Half the members are inactive."
rows = ["CLIENTS: N rows (ACTIVE 0 or 1)"]

[expected.results]
description = "Inactive members are still in MDM, marked ACTIVE=0 (soft state, not purged)."

[expected.validation]
issues = ["All members pass validation"]

[expected.data_issues]
issues = []

[notes]
text = "Soft-deleted / inactive is a flag, not a delete."

[mock]
shape = "inactive"
match_rule = "name_dob"
default_rows = 2

[mock.steps.ingress]
status = "SUCCESS"

[mock.steps.egress]
status = "SUCCESS"
