# TTF use case 10. Human sections are copied to the Excel Home sheet, never interpreted.
# Only [mock] is read by code (mock path behaviour + generated-data shape).

[use_case]
id = "use-case-10"
source = "TTF"
title = "Member with no phone"
template_version = "1.0"
author = "Muse (draft)"
last_updated = "2026-11-23"

[scenario]
summary = "A member arrives with an empty PHONE."
steps = ["Load the 4 TTF landing sheets", "Run tf_Ldg_MDM_CDI_TTF", "Run tf_Stg_MDM_CDI_TTF", "MDM ingress (tester)", "Match and merge", "Egress (tester)", "Read egress tables", "Compare"]

[test_data]
description = "Members whose DEMOGRAPHICS PHONE is blank."
rows = ["CLIENTS: N rows", "DEMOGRAPHICS: N rows (PHONE blank)"]

[expected.results]
description = "Member lands with zero phones and no error."

[expected.validation]
issues = ["All members pass validation"]

[expected.data_issues]
issues = []

[notes]
text = "No ExpectedPhones rows = expect zero phones."

[mock]
shape = "no_phone"
match_rule = "name_dob"
default_rows = 2

[mock.steps.ingress]
status = "SUCCESS"

[mock.steps.egress]
status = "SUCCESS"
