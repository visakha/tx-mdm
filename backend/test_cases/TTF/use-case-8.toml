# TTF use case 8. Human sections are copied to the Excel Home sheet, never interpreted.
# Only [mock] is read by code (mock path behaviour + generated-data shape).

[use_case]
id = "use-case-8"
source = "TTF"
title = "Multi-month member"
template_version = "1.0"
author = "Muse (draft)"
last_updated = "2026-11-23"

[scenario]
summary = "One member across three reporting months."
steps = ["Load the 4 TTF landing sheets", "Run tf_Ldg_MDM_CDI_TTF", "Run tf_Stg_MDM_CDI_TTF", "MDM ingress (tester)", "Match and merge", "Egress (tester)", "Read egress tables", "Compare"]

[test_data]
description = "Three DEMOGRAPHICS months per member; values change each month."
rows = ["CLIENTS: N rows", "DEMOGRAPHICS: 3 rows per member"]

[expected.results]
description = "One master per member; the latest month's values win."

[expected.validation]
issues = ["All members pass validation"]

[expected.data_issues]
issues = []

[notes]
text = "Latest = highest YEAR, MONTH."

[mock]
shape = "multi_month"
match_rule = "name_dob"
default_rows = 2

[mock.steps.ingress]
status = "SUCCESS"

[mock.steps.egress]
status = "SUCCESS"
