# TTF use case 1. Human sections are copied to the Excel Home sheet, never interpreted.
# Only [mock] is read by code (mock path behaviour + generated-data shape).

[use_case]
id = "use-case-1"
source = "TTF"
title = "New member"
template_version = "1.0"
author = "Muse (draft)"
last_updated = "2026-11-23"

[scenario]
summary = "One new member arrives in the TTF landing tables."
steps = ["Load the 4 TTF landing sheets", "Run tf_Ldg_MDM_CDI_TTF", "Run tf_Stg_MDM_CDI_TTF", "MDM ingress (tester)", "Match and merge", "Egress (tester)", "Read egress tables", "Compare"]

[test_data]
description = "1 CLIENTS + 1 FYCLIENTS + 1 SUBMISSIONS + 1 DEMOGRAPHICS row per member."
rows = ["CLIENTS: N rows", "FYCLIENTS: N rows", "DEMOGRAPHICS: N rows", "SUBMISSIONS: 1 row"]

[expected.results]
description = "Each member lands as one zlv_guest master under zlv_ttf; egress row with the same name, DOB and phone."

[expected.validation]
issues = ["All members pass validation"]

[expected.data_issues]
issues = []

[notes]
text = "The simplest end-to-end path."

[mock]
shape = "new_member"
match_rule = "name_dob"
default_rows = 2

[mock.steps.ingress]
status = "SUCCESS"

[mock.steps.egress]
status = "SUCCESS"
