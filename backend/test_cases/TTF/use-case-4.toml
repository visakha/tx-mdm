# TTF use case 4. Human sections are copied to the Excel Home sheet, never interpreted.
# Only [mock] is read by code (mock path behaviour + generated-data shape).

[use_case]
id = "use-case-4"
source = "TTF"
title = "Not a duplicate"
template_version = "1.0"
author = "Muse (draft)"
last_updated = "2026-11-23"

[scenario]
summary = "Same name, different DOB."
steps = ["Load the 4 TTF landing sheets", "Run tf_Ldg_MDM_CDI_TTF", "Run tf_Stg_MDM_CDI_TTF", "MDM ingress (tester)", "Match and merge", "Egress (tester)", "Read egress tables", "Compare"]

[test_data]
description = "Members come in pairs sharing names but not DOB."
rows = ["CLIENTS: N rows (pairs)", "DEMOGRAPHICS: N rows"]

[expected.results]
description = "Two masters per pair; nothing merges."

[expected.validation]
issues = ["All members pass validation"]

[expected.data_issues]
issues = []

[notes]
text = "Each row has its own EXPECT_MASTER_GROUP."

[mock]
shape = "not_duplicate_pairs"
match_rule = "name_dob"
default_rows = 4

[mock.steps.ingress]
status = "SUCCESS"

[mock.steps.egress]
status = "SUCCESS"
